name: audit-structure-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate catalogs (must be committed)
        run: |
          python3 tools/ta-assist index
          git diff --exit-code -- \
            technologies/index.yaml technologies/README.md technologies/_planned.txt \
            projects/index.yaml projects/README.md \
            || (echo "::error::catalogs out of date — run: python3 tools/ta-assist index" && exit 1)
      - name: Run ta-assist check
        run: python3 tools/ta-assist check --format github
