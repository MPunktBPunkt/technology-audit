# Retrieval / usability fixtures for the knowledge base (standard 0.6.5+)
# Structural CI: expected paths must exist (ta-assist check RT1).
# Semantic pass: a human/agent answering the question should cite expect.paths
# and must not treat reject.slugs as equally primary.
#
# Run mentally with: docs/PROJECT-START.md → technologies/index.yaml → FAMILIES

version: 1
updated: 2026-10-11

cases:
