# Retrieval / usability fixtures for the knowledge base (standard 0.6.5+)
# Structural CI: expected paths must exist (ta-assist check RT1/RT2).
# Semantic pass: a human/agent answering the question should cite expect.paths
# and must not treat reject.slugs as equally primary.
# Prefer generated/retrieval/bundles for AI answers (incl. rejected + transfer_limits).
#
# Run: docs/PROJECT-START.md → generated/retrieval/index.yaml → FAMILIES

