; D1 Mini SoftAP + profile N traffic (Δt=20 ms). A0 only.
[env:d1-traffic-n]
platform = espressif32@6.4.0
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DRFSENSE_SSID=\"RFSENSE_N\"
  -DRFSENSE_PASS=\"rfsense_n\"
  -DRFSENSE_CHANNEL=6
  -DRFSENSE_UDP_PORT=5000
  -DRFSENSE_DT_MS=20
