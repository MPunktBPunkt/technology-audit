; Minimal S3 CSI RAW instrument — A0 only. Not rfmonitor.
[env:s3-csi-raw]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
board_build.arduino.memory_type = qio_qspi
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DRFSENSE_SSID=\"RFSENSE_N\"
  -DRFSENSE_PASS=\"rfsense_n\"
  -DRFSENSE_CHANNEL=6
